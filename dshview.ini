# DSHView 配置文件（缺失时程序会自动重建本文件）
# 改完保存，重新打开 DSHView.exe 生效。

# DSH Web 地址。默认值是 dsh web 自己的默认地址（本机场景）。
# 如果 dsh web 在另一台机器上，这里要换成那台机器的 IP，例如：
#   url=http://10.0.0.123:3080/
# 首次访问（或换端口/换机器）时，把 dsh web 打印出来的 ?token=... 一起带上；
# 换到 cookie 之后浏览器已有 30 天有效期的签名 cookie，这里填纯地址即可。
url=http://127.0.0.1:3080/

# 内核位置：webview2 = 用本目录自带的固定版运行时；system = 用系统已装的那份
runtime=webview2

# 浏览器数据目录：保存 token、登录 cookie。删掉它就等于清空登录。
data=profile

# 初始缩放比例
zoom=1.0

# 是否显示地址栏：0 = 纯内容窗口（默认，像 DSH-Portable）；1 = 带地址栏
toolbar=0

# 图标样式（四档）：
#   default = DSH 官方图标（默认，带圆角底，任何背景都看得清）
#   auto    = 跟随系统主题（浅色用黑鲸、深色用白鲸）
#   light   = 始终黑鲸（适合浅色标题栏）   dark = 始终白鲸（适合深色标题栏）
icon=default

# 追加给内核的参数（空格分隔），留空即可。
# 某些安全软件拦截 Chromium 沙箱 IPC 时，可临时加 --no-sandbox 排查。
args=

# 把内网 http 地址提升为安全上下文，剪贴板等 API 才能用；套了 HTTPS 可设 0。
secureorigin=1
