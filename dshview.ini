# ============================================================================
# DSHView configuration / DSHView 配置文件
# ----------------------------------------------------------------------------
# Edit and relaunch DSHView.exe to apply. This file is recreated automatically
# when missing, so deleting it is always safe.
# 改完保存后重新打开 DSHView.exe 生效；文件被删除时会自动重建，删掉不会出问题。
# ============================================================================

# DSH Web address. Defaults to dsh web's own default (same-machine setup).
# 如果 dsh web 在另一台机器上，这里要写那台机器的 IP，例如：
#   url=http://10.0.0.123:3080/
# On first use (or after changing port/machine) include the ?token=... that
# dsh web prints; afterwards a 30-day signed cookie takes over and the plain
# address is enough.
# 首次访问（或换端口/换机器）时带上 dsh web 打印的 ?token=...；
# 拿到 cookie 之后只需填纯地址，凭据默认 30 天有效，dsh web 重启也不会失效。
url=http://127.0.0.1:3080/

# Kernel location / 内核位置:
#   webview2 = the fixed-version runtime bundled in this folder (recommended)
#              用本目录自带的固定版运行时（推荐，目标机无需安装 WebView2）
#   system   = the WebView2 runtime installed on the machine
#              用系统已安装的那份 WebView2
runtime=webview2

# Browser data directory: holds cookies and login state.
# 浏览器数据目录：保存 token 与登录 cookie。删掉它等于清空登录状态。
data=profile

# Icon style / 图标样式 (four values):
#   default = official DSH artwork (default; readable on light and dark frames)
#             DSH 官方图标，带圆角底，浅色/深色背景都看得清
#   auto    = follow the system theme: dark whale on light, white whale on dark
#             跟随系统主题：浅色用黑鲸、深色用白鲸（读 AppsUseLightTheme）
#   light   = always the dark whale (for a light title bar)
#             始终黑鲸，适合浅色标题栏
#   dark    = always the white whale (for a dark title bar)
#             始终白鲸，适合深色标题栏
icon=default

# Close button: ask | tray | quit
#   ask  = prompt every time (default); the prompt has a "remember my
#          choice" box that writes this key for you
#   tray = always minimize to the notification area (the DSH session keeps
#          running; double-click the tray icon to restore, right-click to quit)
#   quit = always exit
# 关闭按钮：ask = 每次询问（默认，询问框里有「记住我的选择」会改写本键）；
#           tray = 直接最小化到托盘（会话不中断，双击托盘图标恢复）；
#           quit = 直接退出。
# Older files may have closetotray=1/0 instead; it still applies when this
# key is absent. / 旧配置里的 closetotray=1/0 在本键缺失时仍然生效。
closeaction=ask

# Extra Chromium flags, space separated. Leave empty normally.
# 追加给内核的参数，空格分隔，通常留空。
# If a security product blocks Chromium's sandbox IPC, try adding --no-sandbox
# to diagnose. 若安全软件拦截 Chromium 沙箱 IPC，可临时加 --no-sandbox 定位。
args=
